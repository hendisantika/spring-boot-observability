# nginx reverse proxy for spring-boot-observability
#
#   loan.jvm.my.id   ->  127.0.0.1:8080   loan-service
#   fraud.jvm.my.id  ->  127.0.0.1:8081   fraud-detection-service
#
# Install:
#   sudo cp docker/nginx/jvm.my.id.conf /etc/nginx/sites-available/jvm.my.id.conf
#   sudo ln -s /etc/nginx/sites-available/jvm.my.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# See the companion notes at the bottom of this file for DNS, certbot and the
# Spring Boot setting this proxy requires.

# --- upstreams -------------------------------------------------------------
# keepalive holds idle connections open to the JVMs, which avoids a TCP
# handshake per request. It requires HTTP/1.1 and an empty Connection header,
# both set in the location blocks below.

upstream loan_service {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream fraud_service {
    server 127.0.0.1:8081;
    keepalive 16;
}

upstream grafana {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Grafana Live streams over a WebSocket at /api/live/ws. This map picks the
# right Connection header per request: "upgrade" during a websocket handshake,
# empty otherwise so upstream keepalive keeps working for ordinary requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# --- rate limiting ---------------------------------------------------------
# Defined but not applied, so this file is safe to drop in as-is. To switch on,
# uncomment the `limit_req` line in whichever location you want to protect.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# --- http -> https ---------------------------------------------------------
# Kept on port 80 for the ACME challenge; everything else is redirected.

server {
    listen 80;
    listen [::]:80;
    server_name loan.jvm.my.id fraud.jvm.my.id grafana.jvm.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- loan-service ----------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name loan.jvm.my.id;

    ssl_certificate     /etc/letsencrypt/live/loan.jvm.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loan.jvm.my.id/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/loan.jvm.my.id/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/loan.jvm.my.id.access.log;
    error_log  /var/log/nginx/loan.jvm.my.id.error.log;

    client_max_body_size 2m;

    # Actuator carries /actuator/prometheus, which publishes JVM internals,
    # HikariCP pool state and every URI the app has served. Prometheus scrapes
    # the JVM directly on :8080, not through nginx, so this can stay private.
    location /actuator/ {
        allow 127.0.0.1;
        allow ::1;
        # allow 10.0.0.0/8;     # add your private ranges if you scrape remotely
        deny all;

        proxy_pass http://loan_service;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    location / {
        # limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://loan_service;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }
}

# --- fraud-detection-service -----------------------------------------------
# loan-service reaches this over loopback on :8081, so it does not need to be
# public for the app to work. It is exposed here because you asked for both;
# see the allowlist note in the location block if you would rather it were not.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fraud.jvm.my.id;

    ssl_certificate     /etc/letsencrypt/live/fraud.jvm.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fraud.jvm.my.id/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/fraud.jvm.my.id/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/fraud.jvm.my.id.access.log;
    error_log  /var/log/nginx/fraud.jvm.my.id.error.log;

    client_max_body_size 2m;

    location /actuator/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://fraud_service;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    location / {
        # This service is an internal dependency of loan-service. To keep it
        # off the public internet while still serving it over TLS, uncomment:
        # allow 127.0.0.1;
        # allow ::1;
        # deny all;

        # limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://fraud_service;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }
}

# --- grafana ---------------------------------------------------------------
#
#  !! READ THIS BEFORE POINTING DNS AT THIS BLOCK !!
#
#  compose.yml starts Grafana with:
#
#      GF_AUTH_ANONYMOUS_ENABLED=true
#      GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
#      GF_AUTH_DISABLE_LOGIN_FORM=true
#
#  That grants Admin to every visitor and removes the login form entirely.
#  Fine on localhost; on a public hostname it hands anyone who finds the URL
#  full Grafana admin — editing dashboards, adding datasources, and reaching
#  whatever those datasources can reach on your network.
#
#  Pick one before exposing this:
#    a) Fix it at the source - drop the three GF_AUTH_ANONYMOUS_* lines from
#       compose.yml and log in properly. This is the real fix.
#    b) Uncomment the auth_basic lines below and create the password file:
#         sudo apt install apache2-utils
#         sudo htpasswd -c /etc/nginx/.htpasswd grafana
#    c) Uncomment the allow/deny lines below to restrict by source IP.
#
#  The proxy is left open here so the block works as written; the choice of
#  protection is deliberately yours.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.jvm.my.id;

    ssl_certificate     /etc/letsencrypt/live/grafana.jvm.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.jvm.my.id/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/grafana.jvm.my.id/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No X-Frame-Options here: Grafana panels are embedded in iframes, and
    # DENY would break that. Grafana sets its own framing policy instead.

    access_log /var/log/nginx/grafana.jvm.my.id.access.log;
    error_log  /var/log/nginx/grafana.jvm.my.id.error.log;

    # Dashboard JSON imports and snapshot uploads can be large.
    client_max_body_size 32m;

    # Grafana Live websocket. Needs its own block so the Upgrade headers are
    # sent and buffering is off; without this, live panels silently stall.
    location /api/live/ws {
        proxy_pass http://grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        # (b) HTTP basic auth - see the note above
        # auth_basic           "Grafana";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        # (c) restrict by source IP - see the note above
        # allow 127.0.0.1;
        # allow ::1;
        # deny all;

        proxy_pass http://grafana;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }
}

# ---------------------------------------------------------------------------
# DNS
#
#   loan.jvm.my.id     A   <server-ip>
#   fraud.jvm.my.id    A   <server-ip>
#   grafana.jvm.my.id  A   <server-ip>
#
# Certificates
#
#   sudo mkdir -p /var/www/certbot
#   # with only the port 80 block enabled, so the challenge can be served:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d loan.jvm.my.id -d fraud.jvm.my.id -d grafana.jvm.my.id
#   sudo systemctl reload nginx
#
# Separate certificates are assumed above, one per subdomain. The command
# issues a single certificate covering both, in which case point both server
# blocks at /etc/letsencrypt/live/loan.jvm.my.id/ instead. Renewal is handled
# by certbot's own timer; check it with `systemctl list-timers | grep certbot`.
#
# Required Spring Boot setting
#
# Without this, both services see every request as plain http from 127.0.0.1:
# generated URLs use the wrong scheme and access logs record the proxy rather
# than the caller. Add to each application.properties:
#
#   server.forward-headers-strategy=framework
#
# Required Grafana setting
#
# Grafana builds absolute URLs (share links, OAuth redirects, alert links)
# from root_url, which defaults to http://localhost:3000. Behind this proxy
# add to the grafana service in compose.yml:
#
#   - GF_SERVER_ROOT_URL=https://grafana.jvm.my.id
#
# ---------------------------------------------------------------------------
