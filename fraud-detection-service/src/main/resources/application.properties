spring.application.name=fraud-detection-service
server.port=8081
# Honour X-Forwarded-* from the nginx reverse proxy (docker/nginx/jvm.my.id.conf).
server.forward-headers-strategy=framework
# Tomcat's MBean registry is off by default; Micrometer needs it to bind the
# tomcat_threads_* / tomcat_global_* meters the Grafana dashboard charts.
server.tomcat.mbeanregistry.enabled=true
spring.sql.init.mode=always
spring.datasource.url=jdbc:mysql://localhost:33081/fraud_detection
spring.datasource.username=yu71
spring.datasource.password=53cret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
management.endpoints.web.exposure.include=health, info, metrics, prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Same value for observations and for every other meter, so the dashboard's
# `application` filter matches consistently across http_server_requests,
# jvm_*, hikaricp_* and tomcat_*.
management.observations.key-values.application=${spring.application.name}
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
spring.docker.compose.enabled=false
